<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06070a" />
<title>NEXO AI - Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(520px 320px at 50% 0,rgba(59,158,255,.16),transparent 70%),#06070a;color:#eef1f8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;text-align:center}
  main{max-width:360px}
  .orb{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#4aa8ff 40%,transparent 72%);box-shadow:0 0 50px rgba(74,168,255,.5);opacity:.55}
  h1{margin:0 0 8px;font-size:24px}p{margin:0 0 22px;color:#8b93a7;line-height:1.5}
  button{border:0;border-radius:16px;padding:14px 28px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#4aa8ff,#8a6bff);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>You're offline</h1>
  <p>NEXO needs an internet connection to reach the AI. Your saved conversations are safe. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
