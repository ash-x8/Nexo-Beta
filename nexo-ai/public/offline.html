<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#04070f" />
<title>NEXO AI - Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#03060d,#0a1530);color:#e8f2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:380px;padding:36px 28px;border:1px solid rgba(110,195,255,.18);border-radius:22px;background:rgba(12,22,46,.6)}
  .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:26px;color:#02121a;background:linear-gradient(135deg,#22d3ee,#3b82f6)}
  h1{margin:0 0 8px;font-size:22px}p{margin:0 0 20px;color:#8ba3c4;line-height:1.5}
  button{border:0;border-radius:12px;padding:11px 22px;font-weight:600;color:#02131c;background:linear-gradient(135deg,#22d3ee,#3b82f6);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="logo">N</div>
  <h1>You're offline</h1>
  <p>NEXO needs an internet connection to reach the AI. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
